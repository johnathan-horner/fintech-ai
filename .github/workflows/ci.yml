name: CI

on:
  push:
    branches: [ main, "rebuild/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app + API + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-dev.txt
      - name: Lint (syntax errors / undefined names only)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,infra/cdk.out
          flake8 . --count --exit-zero --max-line-length=120 --ignore=E501,W503 --statistics --exclude=.venv,infra/cdk.out
      - name: Tests (no network key; Gemini calls are faked)
        run: pytest -q

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MCP dependencies (separate env)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mcp.txt
      - name: Import MCP server
        run: python -c "import mcp_server; print('mcp_server imports successfully')"

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthesize (no AWS credentials, never deploys)
        working-directory: infra
        run: |
          pip install -r requirements.txt
          npx -y aws-cdk@2 synth --no-notices -q

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history with gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --log-opts="--all" --redact --no-banner
